<html lang="en" class="scroll-smooth">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eric Osei Adjei — Personal Portfolio</title>
    <meta
      name="description"
      content="Personal portfolio of Eric Osei Adjei — Social Media Strategist at EKB Studios, Data Analyst, and Graphic Designer."
    />
    <meta property="og:title" content="Eric Osei Adjei — Personal Portfolio" />

      content="Personal portfolio of Eric Osei Adjei — Social Media Strategist at EKB Studios, Data Analyst, and Graphic Designer."

    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('portfolio_theme');
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#F1F5F9] dark:bg-[#071320] text-[#0B1F33] dark:text-slate-100 antialiased selection:bg-[#1D4ED8] selection:text-white dark:selection:bg-[#F59E0B] dark:selection:text-[#071320] transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
